<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spritesheet Monitor</title>
  <style>
    :root{color-scheme:dark;--bg:#070b13;--panel:#101827;--line:#26344a;--text:#f6f8fc;--muted:#91a5c5;--cyan:#51d7ff;--green:#42dfa8;--track:#2a3850}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 65% -20%,#14233f 0,transparent 38%),var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}main{width:min(100% - 48px,1720px);margin:auto;padding:20px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:44px;height:44px;border:1px solid #315073;border-radius:12px;color:var(--cyan);font-size:22px}.eyebrow{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.title{font-size:24px;font-weight:800}.connection{display:flex;align-items:center;gap:8px;color:var(--muted)}.dot,.state{display:inline-block;width:8px;height:8px;border-radius:50%;background:#61718a}.connection.live .dot,.completed .state{background:var(--green);box-shadow:0 0 12px #42dfa888}.processing .state{background:var(--cyan);box-shadow:0 0 12px #51d7ffaa}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.job,.empty{border:1px solid var(--line);background:linear-gradient(145deg,#111a2a,#0e1623);border-radius:16px}.card{padding:17px}.metric-head{display:flex;justify-content:space-between;color:#8eb0e5;font-size:12px}.metric-value{font-size:28px;font-weight:800;margin:16px 0 7px}.metric-value.io{display:flex;gap:16px;font-size:15px}.down{color:var(--cyan)}.up{color:#ffb45c}.metric-sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meter{height:6px;background:var(--track);border-radius:99px;overflow:hidden}.meter i{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#766bff,var(--cyan));transition:width .35s}.section-head{display:flex;justify-content:space-between;align-items:end;margin:28px 2px 10px}.section-head h2{font-size:16px;margin:0}.section-head span{color:var(--muted);font-size:12px}.jobs{display:grid;gap:12px}.job{overflow:hidden}.job-head{display:grid;grid-template-columns:1fr 170px;gap:20px;padding:18px}.job-name{font-size:17px;font-weight:800}.job-meta{display:flex;flex-wrap:wrap;gap:16px;color:#8da8d5;font-size:11px;margin-top:4px}.overall{text-align:right}.overall strong{display:block;font-size:23px}.steps{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;padding:8px 18px 14px;border-top:1px solid var(--line)}.step{display:grid;grid-template-columns:180px 1fr 48px;align-items:center;gap:12px;min-height:40px;border-bottom:1px solid #1f2b3d}.step-name{display:flex;align-items:center;gap:8px}.pct{text-align:right}.empty{display:grid;place-items:center;min-height:160px;color:var(--muted);text-align:center}.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
    .log-btn{border:1px solid #355075;border-radius:7px;background:#15233a;color:#b9dcff;padding:3px 8px;font:inherit;cursor:pointer}.log-btn:hover{border-color:var(--cyan);color:white}.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(2,5,10,.78);backdrop-filter:blur(6px)}.modal.open{display:flex}.log-panel{display:flex;flex-direction:column;width:min(1100px,96vw);height:min(760px,90vh);background:#080d16;border:1px solid #314768;border-radius:16px;box-shadow:0 28px 80px #000;overflow:hidden}.log-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.log-title{font-weight:800}.log-status{font-size:11px;color:var(--muted);margin-left:10px}.close-btn{border:0;background:transparent;color:#b6c8e2;font-size:24px;cursor:pointer}.log-output{flex:1;margin:0;padding:18px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#cfe2ff;background:#050912;font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace}
    @media(max-width:900px){.metrics{grid-template-columns:1fr 1fr}.steps{grid-template-columns:1fr}}@media(max-width:560px){main{width:min(100% - 22px,1720px)}.metrics{gap:8px}.card{padding:13px}.job-head{grid-template-columns:1fr}.overall{text-align:left}.step{grid-template-columns:145px 1fr 42px}.connection span:last-child{display:none}}
  </style>
</head>
<body><main>
  <header class="top"><div class="brand"><div class="logo">▦</div><div><div class="eyebrow">Realtime worker</div><div class="title">Spritesheet Monitor</div></div></div><div id="connection" class="connection"><i class="dot"></i><span>Connecting</span></div></header>
  <section class="metrics">
    <article class="card"><div class="metric-head"><span>GPU</span><span id="gpuTemp">—</span></div><div class="metric-value" id="gpuValue">—</div><div class="meter"><i id="gpuMeter"></i></div><div class="metric-sub" id="gpuName">Waiting for NVIDIA</div></article>
    <article class="card"><div class="metric-head"><span>NVDEC</span><span id="gpuMemory">—</span></div><div class="metric-value" id="decoderValue">—</div><div class="meter"><i id="decoderMeter"></i></div><div class="metric-sub" id="gpuEncode">Encoder —</div></article>
    <article class="card"><div class="metric-head"><span>CPU</span><span id="cpuCores">—</span></div><div class="metric-value" id="cpuValue">—</div><div class="meter"><i id="cpuMeter"></i></div><div class="metric-sub" id="memory">Memory —</div></article>
    <article class="card"><div class="metric-head"><span>DISK I/O</span><span id="diskUsed">—</span></div><div class="metric-value io"><span class="down">↓ <b id="diskRead">—</b></span><span class="up">↑ <b id="diskWrite">—</b></span></div><div class="meter"><i id="diskMeter"></i></div><div class="metric-sub">Read / Write per second</div></article>
  </section>
  <div class="section-head"><h2>Active jobs</h2><span id="updated">Waiting for data…</span></div>
  <section id="jobs" class="jobs"><div class="empty"><div><strong>No active spritesheets</strong>Waiting for a worker to claim a job</div></div></section>
</main><div class="modal" id="logModal" role="dialog" aria-modal="true" aria-labelledby="logTitle"><section class="log-panel"><header class="log-head"><div><span class="log-title" id="logTitle">Process log</span><span class="log-status" id="logStatus">Loading</span></div><button class="close-btn" id="closeLog" aria-label="Close">×</button></header><pre class="log-output" id="logOutput"></pre></section></div><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pct=v=>Math.max(0,Math.min(100,Number(v)||0)),percent=v=>`${pct(v).toFixed(Number(v)%1?1:0)}%`;
function bytes(v){v=Number(v)||0;const u=['B','KB','MB','GB','TB'];let i=0;while(v>=1024&&i<u.length-1){v/=1024;i++}return`${v.toFixed(i<2?0:1)} ${u[i]}`}const speed=v=>`${bytes(v)}/s`,meter=(id,v)=>$(id).style.width=`${pct(v)}%`;
function renderSystem(s={}){const g=(s.gpus||[])[0];if(g){$('gpuValue').textContent=percent(g.gpuPercent);$('gpuName').textContent=g.name;$('gpuTemp').textContent=`${g.temperature||0}°C · ${Number(g.powerWatts||0).toFixed(0)}W`;meter('gpuMeter',g.gpuPercent);$('decoderValue').textContent=percent(g.decoderPercent);meter('decoderMeter',g.decoderPercent);$('gpuMemory').textContent=`${bytes(g.memoryUsed)} / ${bytes(g.memoryTotal)}`;$('gpuEncode').textContent=`Encoder ${percent(g.encoderPercent)}`}else{$('gpuValue').textContent='N/A';$('gpuName').textContent=s.gpuError||'NVIDIA GPU not found';$('decoderValue').textContent='N/A'}const c=s.cpu||{};$('cpuValue').textContent=percent(c.percent);$('cpuCores').textContent=`${c.cores||0} threads`;meter('cpuMeter',c.percent);const m=s.memory||{};$('memory').textContent=`Memory ${bytes(m.used)} / ${bytes(m.total)} (${percent(m.percent)})`;const d=s.disk||{};$('diskRead').textContent=speed(d.readBytesPerSecond);$('diskWrite').textContent=speed(d.writeBytesPerSecond);$('diskUsed').textContent=`${bytes(d.used)} / ${bytes(d.total)}`;meter('diskMeter',d.percent)}
function renderJobs(j=[]){if(!j.length){$('jobs').innerHTML='<div class="empty"><div><strong>No active spritesheets</strong>Waiting for a worker to claim a job</div></div>';return}$('jobs').innerHTML=j.map(x=>`<article class="job"><header class="job-head"><div><div class="job-name">${esc(x.slug||x.fileId||x.id)}</div><div class="job-meta"><span>${esc(x.workerId)}</span><span>Job ${esc(x.id)}</span>${x.fileId?`<span>File ${esc(x.fileId)}</span>`:''}<button class="log-btn" data-job-id="${esc(x.id)}" data-slug="${esc(x.slug||x.id)}">View log</button></div></div><div class="overall"><strong>${percent(x.overallPercent)}</strong><div class="meter"><i style="width:${pct(x.overallPercent)}%"></i></div></div></header><div class="steps">${(x.steps||[]).map(s=>`<div class="step ${esc(s.status)}"><div class="step-name"><i class="state"></i>${esc(s.label)}</div><div class="meter"><i style="width:${pct(s.percent)}%"></i></div><div class="pct">${percent(s.percent)}</div></div>`).join('')}</div></article>`).join('');document.querySelectorAll('.log-btn').forEach(button=>button.addEventListener('click',()=>openLog(button.dataset.jobId,button.dataset.slug)))}
let logTimer=null,activeLogId='';async function refreshLog(){if(!activeLogId)return;const output=$('logOutput'),atBottom=output.scrollHeight-output.scrollTop-output.clientHeight<40;try{const response=await fetch('/logs/'+encodeURIComponent(activeLogId),{cache:'no-store'}),text=await response.text();if(!response.ok)throw new Error(text.trim()||('HTTP '+response.status));output.textContent=text;$('logStatus').textContent=response.headers.get('X-Log-Truncated')==='true'?'Live · latest 512 KiB':'Live';if(atBottom)output.scrollTop=output.scrollHeight}catch(error){output.textContent=error.message;$('logStatus').textContent='Unavailable'}}function openLog(id,slug){activeLogId=id;$('logTitle').textContent='Log · '+slug;$('logOutput').textContent='Loading…';$('logModal').classList.add('open');refreshLog();clearInterval(logTimer);logTimer=setInterval(refreshLog,1000)}function closeLog(){activeLogId='';clearInterval(logTimer);logTimer=null;$('logModal').classList.remove('open')}$('closeLog').addEventListener('click',closeLog);$('logModal').addEventListener('click',event=>{if(event.target===$('logModal'))closeLog()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeLog()});
const connection=$('connection'),source=new EventSource('/events');source.onopen=()=>{connection.classList.add('live');connection.lastElementChild.textContent='Live'};source.onerror=()=>{connection.classList.remove('live');connection.lastElementChild.textContent='Reconnecting'};source.onmessage=e=>{try{const d=JSON.parse(e.data);renderSystem(d.system);renderJobs(d.jobs);$('updated').textContent=`${d.jobs.length} running · updated ${new Date(d.timestamp).toLocaleTimeString()}`}catch(_){}};
</script></body></html>
